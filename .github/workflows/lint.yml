name: lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: shellcheck install/uninstall
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -y && sudo apt-get install -y shellcheck
      - name: Lint
        run: |
          shellcheck install.sh
          shellcheck uninstall.sh

  json-validate:
    name: validate examples + plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - name: Install jsonschema
        run: python -m pip install --quiet jsonschema
      - name: JSON syntax
        run: |
          for f in examples/*.json .claude-plugin/plugin.json skills/do/references/config.schema.json skills/do/hooks/settings.with-hooks.json; do
            echo "Checking $f"
            python -m json.tool "$f" > /dev/null
          done
      - name: Validate examples against config.schema.json
        run: |
          python - <<'PY'
          import json, sys, glob
          import jsonschema

          schema = json.load(open('skills/do/references/config.schema.json'))
          fail = 0
          for f in sorted(glob.glob('examples/*.json')):
              cfg = json.load(open(f))
              errs = list(jsonschema.Draft202012Validator(schema).iter_errors(cfg))
              if errs:
                  fail += len(errs)
                  print(f'❌ {f}')
                  for e in errs[:5]:
                      print(f'   {list(e.absolute_path) or "<root>"}: {e.message}')
              else:
                  print(f'✓ {f}')
          sys.exit(1 if fail else 0)
          PY

  skill-frontmatter:
    name: SKILL.md frontmatter sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - name: Install pyyaml
        run: python -m pip install --quiet pyyaml
      - name: Check frontmatter
        run: |
          python - <<'PY'
          import yaml, sys, pathlib
          p = pathlib.Path('skills/do/SKILL.md')
          parts = p.read_text().split('---', 2)
          assert len(parts) >= 3, 'no frontmatter delimiter found'
          fm = yaml.safe_load(parts[1])
          for required in ('name', 'version', 'description', 'model'):
              assert required in fm, f'missing frontmatter key: {required}'
          assert fm['name'] == 'do', f'name must be "do", got {fm["name"]!r}'
          assert isinstance(fm['version'], str) and fm['version'].count('.') == 2, \
              f'version must be semver string, got {fm["version"]!r}'
          assert fm['model'] == 'opus', \
              f'model must be "opus" (architect/reviewer role pinned regardless of session), got {fm["model"]!r}'
          # v0.3.0: disable-model-invocation removed to enable +++ trigger.
          # If reintroduced, it MUST be paired with removing the +++ trigger
          # from install.sh + README — otherwise it silently breaks the
          # shortcut (see v0.2.0-v0.2.5 history).
          assert 'disable-model-invocation' not in fm or fm.get('disable-model-invocation') is not True, \
              ('disable-model-invocation: true is incompatible with the +++ trigger '
               'that install.sh writes to CLAUDE.md. If you intentionally want hard '
               'auto-trigger blocking, also remove the trigger feature from install.sh '
               'and the +++ section from README.')
          desc = fm['description']
          assert 'TRIGGER ONLY' in desc and 'NEVER auto-trigger' in desc and 'SKIP' in desc, \
              ('description must include strict "TRIGGER ONLY when LITERALLY starts with..." + '
               '"NEVER auto-trigger from description matching" + SKIP block — the soft guard '
               'against false-positive triggering when disable-model-invocation is not set.')
          print('frontmatter OK:', {k: v if k != 'description' else f'{len(v)} chars' for k, v in fm.items()})
          PY

  markdown-links:
    name: Markdown link sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check internal links resolve
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          root = pathlib.Path('.')
          link_re = re.compile(r'\[[^\]]+\]\(([^)]+)\)')
          fail = 0
          for md in root.rglob('*.md'):
              if any(part.startswith('.') for part in md.parts):  # skip hidden dirs
                  continue
              for m in link_re.finditer(md.read_text()):
                  target = m.group(1).split('#')[0]  # strip anchor
                  if not target or target.startswith(('http://', 'https://', 'mailto:', 'tel:')):
                      continue
                  resolved = (md.parent / target).resolve()
                  if not resolved.exists():
                      print(f'❌ {md}: broken link → {target}')
                      fail += 1
          if fail:
              print(f'\n{fail} broken link(s)')
              sys.exit(1)
          print('All internal markdown links resolve')
          PY
